      - { pregunta: "¿Cómo se pagan las sesiones?", respuesta: "Por transferencia, Bizum o tarjeta, al final de cada sesión. Te doy factura." }
      - { pregunta: "¿Y si tengo que cancelar una cita?", respuesta: "Avísame con 24 horas de antelación y la cambiamos sin coste." }
