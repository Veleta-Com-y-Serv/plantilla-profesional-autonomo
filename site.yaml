    antetitulo: Sobre mí
    titulo: Soy Clara. Escucho primero y propongo después.
    declaracion: "Ningún problema es pequeño si te quita el sueño."
    texto: |
      Me formé en Salamanca y trabajé cuatro años en un centro de psicología de Pamplona antes de abrir mi consulta en Logroño.

      Trabajo con terapia cognitivo-conductual y con herramientas de tercera generación. Me adapto a ti: hay personas que necesitan pautas concretas y otras que necesitan, sobre todo, tiempo para ordenar lo que sienten.

      La consulta es un espacio tranquilo y discreto, a dos minutos de la plaza del Mercado. Si lo prefieres, hacemos las sesiones por videollamada.
    imagen: /fotos/consulta.jpg
