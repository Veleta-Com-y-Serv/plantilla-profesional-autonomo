id: profesional-autonomo
nombre: Profesional independiente
descripcion: Web personal para psicólogos, coaches, consultores y otros profesionales que trabajan por su cuenta.
sectores: [autonomo, consultor, coach, psicologia, nutricion, freelance, formador]
secciones:
  - { id: hero, nombre: Portada }
  - { id: sobre, nombre: Sobre mí }
  - { id: trayectoria, nombre: Trayectoria }
  - { id: servicios, nombre: Servicios }
  - { id: proceso, nombre: Cómo trabajo }
  - { id: opiniones, nombre: Opiniones }
  - { id: preguntas, nombre: Preguntas frecuentes }
  - { id: cita, nombre: Pedir cita }
  - { id: contacto, nombre: Contacto }
estilo: personal
plan_minimo: gratis
version: 1.1.0
base: astrowind
demo_url: https://demo-plantilla-profesional-autonomo.noexpertise.com
activa: true
orden: 150

# Asistente de puesta en marcha (NoExpertise): un paso por pantalla. Rutas del site sin índices;
# tipos: texto y lista (la IA propone), datos, fotos, eleccion (colores y logo) y repaso.
asistente:
  - id: negocio
    titulo: "Tú y tu trabajo"
    pregunta: "¿Cómo te llamas y a qué te dedicas?"
    ayuda: "Qué haces, para quién y si atiendes en persona o en línea."
    tipo: texto
    campos: [nombre, eslogan, secciones.hero.antetitulo, secciones.hero.titulo, secciones.hero.texto, secciones.hero.destacado.titulo, secciones.hero.destacado.texto, seo.descripcion]
  - id: contacto
    titulo: "Cómo te encuentran"
    pregunta: "¿Cómo te pueden llamar o escribir?"
    ayuda: "Solo lo que quieras que vean tus clientes. Lo que dejes vacío no sale en tu web."
    tipo: datos
    campos: [contacto.telefono, contacto.whatsapp, contacto.email, contacto.direccion, contacto.horario, secciones.cita.enlace_agenda, redes.instagram, redes.linkedin]
  - id: sobre
    titulo: "Sobre ti"
    pregunta: "Cuéntame tu historia: formación, experiencia y cómo trabajas."
    tipo: texto
    campos: [secciones.sobre.titulo, secciones.sobre.declaracion, secciones.sobre.texto, secciones.sobre.items]
  - id: trayectoria
    titulo: "Tu trayectoria"
    pregunta: "¿Qué momentos importantes tiene tu carrera? El año y qué pasó, uno por línea."
    ayuda: "Si lo prefieres, añádelos luego en Contenido."
    tipo: lista
    campos: [secciones.trayectoria.hitos]
  - id: servicios
    titulo: "Tus servicios"
    pregunta: "¿Qué servicios ofreces? Uno por línea, con la duración y el precio si quieres."
    ayuda: "Si lo prefieres, añádelos luego en Contenido."
    tipo: lista
    campos: [secciones.servicios.items]
  - id: proceso
    titulo: "Cómo trabajas"
    pregunta: "¿Cómo es trabajar contigo, desde el primer contacto?"
    tipo: texto
    campos: [secciones.proceso.titulo, secciones.proceso.items]
  - id: preguntas
    titulo: "Preguntas frecuentes"
    pregunta: "¿Qué os preguntan más a menudo? Escribe cada pregunta y lo que respondéis."
    ayuda: "Si lo prefieres, añádelos luego en Contenido."
    tipo: lista
    campos: [secciones.preguntas.preguntas]
  - id: cita
    titulo: "Pedir cita"
    pregunta: "¿Cómo se pide cita contigo?"
    tipo: texto
    campos: [secciones.cita.titulo, secciones.cita.texto, secciones.cita.nota]
  - id: fotos
    titulo: "Tus fotos"
    pregunta: "Pon una foto tuya o de tu espacio de trabajo y, si quieres, alguna más."
    ayuda: "Sube las tuyas o elige una del banco. Las que no cambies se quedan como están."
    tipo: fotos
    campos: [secciones.hero.imagen, secciones.sobre.imagen, secciones.trayectoria.imagen, secciones.cita.imagen]
  - id: aspecto
    titulo: "Colores y logo"
    pregunta: "Elige los colores de tu web y, si tienes, tu logo."
    tipo: eleccion
    campos: [colores.primario, colores.acento, logo]
  - id: repaso
    titulo: "Repaso"
    tipo: repaso
